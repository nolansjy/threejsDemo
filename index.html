<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading...</title>
  </head>
  <body>
    <script type="module">
        import { getSession } from './src/api/auth.js';

        async function routeFromSession() {
          try{
            const session = await getSession();
            if (session) {
                window.location.replace('./app.html');
            } else {
                window.location.replace('./auth.html');
            }
          }catch(err){
            console.error('Session check failed:', err);
            window.location.replace('./auth.html');
          }
            
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', routeFromSession, { once: true });
        } else {
          routeFromSession();
        }
    </script>
  </body>
</html>
