<!DOCTYPE html>
<html>
	<head>
		<title>three.js css3d - employee demo</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js css3d - periodic table">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/css3d_periodictable.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/css3d_periodictable.jpg">

		<script src="https://accounts.google.com/gsi/client" async></script>
	</head>
	<body>

		<div
		id="g_id_onload"
		data-auto_prompt="false"
		data-callback="handleCredentialResponse"
		data-client_id="%VITE_GOOGLE_CLIENT_ID%"
		></div>
		<!-- g_id_signin places the button on a page and supports customization -->
		<div class="g_id_signin"></div>

		<script type="module">
		import { getSession, loginWithGoogleCredential } from './src/api/auth.js';

		function decodeJWT(token) {

			let base64Url = token.split(".")[1];
			let base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
			let jsonPayload = decodeURIComponent(
			atob(base64)
				.split("")
				.map(function (c) {
				return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
				})
				.join("")
			);
			return JSON.parse(jsonPayload);
		}

		window.handleCredentialResponse = async function handleCredentialResponse(response) {
			if (!response?.credential) return;

			const payload = decodeJWT(response.credential);
			console.log('Google user:', payload.email, payload.sub);

			const result = await loginWithGoogleCredential(response.credential);
			if (!result.ok) {
				console.log(`Sign-in failed (${result.status}).`);
				return;
			}

			window.location.replace('/app.html');
		};

		async function isLoggedIn() {
			const existingSession = await getSession();
			if (existingSession) {
				window.location.replace('/app.html');
			}
		};
		isLoggedIn();
		</script>
    </body>
</html>
