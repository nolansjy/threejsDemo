<!DOCTYPE html>
<html>
	<head>
		<title>three.js css3d - employee demo</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js css3d - periodic table">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/css3d_periodictable.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/css3d_periodictable.jpg">
		<link type="text/css" rel="stylesheet" href="./src/main.css">
		<link type="text/css" rel="stylesheet" href="./src/objects.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> css3d - employee info.
			<button id="logout">LOGOUT</button>
		</div>
		<div id="container"></div>
		<div id="menu">
			<button id="table">TABLE</button>
			<button id="sphere">SPHERE</button>
			<button id="helix">HELIX</button>
			<button id="grid">GRID</button>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "../jsm/"
				}
			}
		</script>

	<script type="module">
		import { requireSession, logout } from './src/api/auth.js';
		requireSession();
		const buttonLogout = document.getElementById('logout');
		buttonLogout.addEventListener('click', function(){
			logout();
		});
	</script>
	<script type="module" src="./src/main.js"></script>
